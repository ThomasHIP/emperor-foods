<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="Emperor Duck เป็ดจักรพรรดิ">
<style>
#logo{transform-origin:300px 180px;animation:breathe 5.2s ease-in-out infinite;filter:drop-shadow(0 7px 16px rgba(86,20,28,.10))}
#shine{animation:shine 6.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.012)}}
@keyframes shine{0%,62%,100%{transform:translateX(-420px);opacity:0}12%{opacity:.15}34%{transform:translateX(770px);opacity:.4}44%{opacity:0}}
@media (prefers-reduced-motion:reduce){#logo,#shine{animation:none}}
</style>
<defs><clipPath id="clip"><rect width="600" height="360" rx="24"/></clipPath><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff4c7" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g id="logo"><image href="data:image/webp;base64," x="70" y="48" width="460" height="296" preserveAspectRatio="xMidYMid meet"/></g>
<g clip-path="url(#clip)"><rect id="shine" x="-120" y="24" width="88" height="312" fill="url(#g)" transform="skewX(-18)"/></g>
</svg>